<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>기프티콘 보관함</title>
  <link rel="stylesheet" href="style.css?v=7" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>기프티콘 보관함</h1>
        <p>업로드하고, 날짜를 자동 인식하고, 만료 전 확인하세요</p>
      </div>

      <div class="topbar-meta">
        <div class="count-chip" id="countChip">0개</div>

        <div class="filter-row">
          <button class="filter-chip active" id="filterAll" type="button">전체</button>
          <button class="filter-chip" id="filterSoon" type="button">임박</button>
          <button class="filter-chip" id="filterExpired" type="button">만료</button>
        </div>
      </div>
    </header>

    <main id="content"></main>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple />

  <button class="fab" id="addBtn" type="button">+</button>

  <div class="modal" id="modal">
    <div class="sheet">
      <div class="handle"></div>

      <img id="modalImage" class="modal-image" src="" alt="기프티콘 상세 이미지" />

      <div class="status-wrap">
        <div class="big-dday" id="modalDday"></div>
        <div class="subtext" id="modalSubtext"></div>
      </div>

      <div class="field">
        <label for="brandInput">브랜드명</label>
        <input type="text" id="brandInput" placeholder="예: 스타벅스" />
      </div>

      <div class="field">
        <label for="memoInput">메모</label>
        <textarea id="memoInput" rows="3" placeholder="예: 아이스 아메리카노 1잔"></textarea>
      </div>

      <div class="field">
        <label for="expireInput">만료일</label>
        <input type="date" id="expireInput" />
      </div>

      <div class="field">
        <label for="ocrText">인식된 텍스트</label>
        <textarea id="ocrText" rows="4" readonly></textarea>
      </div>

      <div class="action-row">
        <button class="btn ghost" id="closeBtn" type="button">닫기</button>
        <button class="btn primary" id="saveBtn" type="button">저장</button>
      </div>

      <div class="action-row single">
        <button class="btn danger" id="deleteBtn" type="button">삭제</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=7"></script>
</body>
</html>
